      <div class="container">
        <a class="navbar-brand logo" href="index.html"><i class="fa-solid fa-bolt"></i> Tenis en tu Zona</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">

        <div class="collapse navbar-collapse" id="menu">

  <main class="container pagina">
    <section>
      <h1 class="titulo-seccion">Catálogo de tenis</h1>

      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
          <label for="buscar" class="form-label">Buscar por nombre</label>
          <input type="text" class="form-control" id="buscar" placeholder="Ej. Runner">
        </div>
        <div class="col-12 col-md-6">
          <label for="filtro-categoria" class="form-label">Categoría</label>
          <select class="form-select" id="filtro-categoria">
            <option value="todas">Todas</option>
            <option value="running">Running</option>
            <option value="casual">Casual</option>
            <option value="basquetbol">Básquetbol</option>
          </select>
        </div>
      </div>

       <div class="row g-4" id="lista-productos"></div>
      <p class="text-center mt-4 d-none" id="sin-resultados">No encontramos tenis con esa búsqueda.</p>
    </section>
  </main>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="row align-items-center text-center text-md-start">
