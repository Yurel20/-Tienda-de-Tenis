<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tenis en tu Zona - Tienda en línea de tenis">
  <title>Carrito Tenis en tu Zona </title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand logo" href="index.html"><i class="fa-solid fa-bolt"></i> Tenis en tu Zona </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link active" href="carrito.html"><i class="fa-solid fa-cart-shopping"></i> Carrito <span class="badge bg-warning text-dark" id="contador-carrito">0</span></a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container pagina">
    <section>
      <h1 class="titulo-seccion">Tu carrito</h1>

      <div class="table-responsive">
        <table class="table align-middle" id="tabla-carrito">
          <thead>
            <tr>
              <th scope="col">Producto</th>
              <th scope="col">Precio</th>
              <th scope="col">Cantidad</th>
              <th scope="col">Subtotal</th>
              <th scope="col"><span class="visually-hidden">Quitar</span></th>
            </tr>
          </thead>
          <tbody id="cuerpo-carrito"></tbody>
        </table>
      </div>

      <p class="text-center d-none" id="carrito-vacio">Tu carrito está vacío. <a href="catalogo.html">Ir al catálogo</a></p>

      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 mt-3" id="resumen-carrito">
        <button class="btn btn-outline-dark" id="btn-vaciar">Vaciar carrito</button>
        <div class="text-center text-sm-end">
          <p class="fs-4 mb-2">Total: <strong id="total-carrito">$0</strong></p>
          <button class="btn btn-naranja btn-lg" id="btn-comprar">Finalizar compra</button>
        </div>
      </div>
    </section>
  </main>
   <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="row align-items-center text-center text-md-start">
        <div class="col-12 col-md-6 mb-2 mb-md-0">
          <strong>Tenis en tu Zona </strong>
        </div>
        <div class="col-12 col-md-6 text-md-end redes">
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        </div>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="funcion.js"></script>
</body>
</html>
